# The only user-selectable composition is the safe Router. Engine-owned workers receive tools dynamically in their own Agent scope.
- insert:
    - id: dsh-superagent
      name: dsh-superagent
    - id: dsh-superagent-github
      name: dsh-superagent/github-watch
    - id: dsh-superagent-feishu
      name: dsh-superagent/feishu-watch
      disabled: true
    - id: dsh-superagent-router-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-superagent-router
        name: Superagent
        description: 当前会话负责交流和路由，执行工作交给独立 Worker。支持纯本地使用，可选配置 GitHub 等远端来源。
        order: 10
        plugins:
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
